name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            arch: x64
          - rid: win-arm64
            arch: arm64

    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Get version from tag
      id: version
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Update version in Directory.Build.props
      shell: pwsh
      run: |
        $content = Get-Content Directory.Build.props -Raw
        $content = $content -replace '<VersionPrefix>[^<]+</VersionPrefix>', "<VersionPrefix>${{ steps.version.outputs.version }}</VersionPrefix>"
        Set-Content Directory.Build.props $content

    - name: Restore dependencies
      run: dotnet restore StickyTerm.sln

    - name: Run tests
      run: dotnet test StickyTerm.Tests/StickyTerm.Tests.csproj --configuration Release --verbosity normal

    - name: Publish self-contained executable
      run: dotnet publish StickyTerm/StickyTerm.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-${{ matrix.arch }}

    - name: Create portable zip
      shell: pwsh
      run: |
        Compress-Archive -Path "publish-${{ matrix.arch }}\*" -DestinationPath "StickyTerm-${{ github.ref_name }}-${{ matrix.arch }}.zip"

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress

    - name: Build installer
      shell: pwsh
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ steps.version.outputs.version }}" /DMyAppArch="${{ matrix.arch }}" Installer\StickyTerm.iss

    - name: Upload portable zip
      uses: actions/upload-artifact@v4
      with:
        name: portable-${{ matrix.arch }}
        path: "StickyTerm-${{ github.ref_name }}-${{ matrix.arch }}.zip"

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: installer-${{ matrix.arch }}
        path: "Output/StickyTerm_Setup_${{ steps.version.outputs.version }}_${{ matrix.arch }}.exe"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List artifacts
      run: find artifacts -type f

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          artifacts/portable-x64/*.zip
          artifacts/portable-arm64/*.zip
          artifacts/installer-x64/*.exe
          artifacts/installer-arm64/*.exe
