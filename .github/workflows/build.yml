name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore StickyTerm.sln

    - name: Build
      run: dotnet build StickyTerm.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test StickyTerm.Tests/StickyTerm.Tests.csproj --no-build --configuration Release --verbosity normal

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: StickyTerm-build
        path: StickyTerm/bin/Release/
        retention-days: 7
