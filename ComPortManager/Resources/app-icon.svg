<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B5797;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="portGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="16" y="16" width="224" height="224" rx="32" ry="32" fill="url(#bgGradient)"/>

  <!-- COM Port connector shape (DB9 style) -->
  <g transform="translate(48, 48)">
    <!-- Outer shell of the connector -->
    <path d="M20,20 L140,20 C150,20 160,30 160,40 L160,120 C160,130 150,140 140,140 L20,140 C10,140 0,130 0,120 L0,40 C0,30 10,20 20,20 Z"
          fill="#E8E8E8" stroke="#666" stroke-width="3"/>

    <!-- Inner area -->
    <rect x="15" y="35" width="130" height="90" rx="8" fill="#333"/>

    <!-- Pin holes - 5 on top row -->
    <circle cx="35" cy="55" r="8" fill="url(#portGradient)" stroke="#B8860B" stroke-width="2"/>
    <circle cx="60" cy="55" r="8" fill="url(#portGradient)" stroke="#B8860B" stroke-width="2"/>
    <circle cx="85" cy="55" r="8" fill="url(#portGradient)" stroke="#B8860B" stroke-width="2"/>
    <circle cx="110" cy="55" r="8" fill="url(#portGradient)" stroke="#B8860B" stroke-width="2"/>
    <circle cx="135" cy="55" r="8" fill="#666" stroke="#444" stroke-width="2"/>

    <!-- Pin holes - 4 on bottom row -->
    <circle cx="47" cy="85" r="8" fill="url(#portGradient)" stroke="#B8860B" stroke-width="2"/>
    <circle cx="72" cy="85" r="8" fill="url(#portGradient)" stroke="#B8860B" stroke-width="2"/>
    <circle cx="97" cy="85" r="8" fill="url(#portGradient)" stroke="#B8860B" stroke-width="2"/>
    <circle cx="122" cy="85" r="8" fill="#666" stroke="#444" stroke-width="2"/>

    <!-- Mounting screw holes -->
    <circle cx="10" cy="80" r="6" fill="#444"/>
    <circle cx="150" cy="80" r="6" fill="#444"/>
  </g>

  <!-- Arrow indicating port mapping -->
  <g transform="translate(180, 160)">
    <path d="M0,0 L30,0 L30,-10 L50,10 L30,30 L30,20 L0,20 Z"
          fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  </g>

  <!-- COM text -->
  <text x="128" y="230" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        fill="white" text-anchor="middle">COM</text>
</svg>
